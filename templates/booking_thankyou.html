<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Booking Request Received | Hair Extensions Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #0b0b0f;
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --border: rgba(255,255,255,.12);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: "Manrope", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, rgba(255,255,255,.12), transparent 60%),
                  radial-gradient(1000px 600px at 90% 10%, rgba(255,255,255,.10), transparent 55%),
                  var(--bg);
      color: var(--text);
      line-height:1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container{
      text-align: center;
      padding: 40px 24px;
      max-width: 550px;
    }

    .check{
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1{
      margin: 0 0 16px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    p{
      color: var(--muted);
      margin: 0 0 12px;
      font-size: 16px;
    }

    .btnrow{
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: transform .12s ease, background .12s ease;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.10); }
  </style>
</head>

<body>
  <div class="container">
    <div class="check">✓</div>
    <h1>Thanks{{ ', ' + client_name if client_name else '' }}! Your booking request is in.</h1>
    <p>I'll review your details and confirm a day & time with you personally — usually within 24–48 hours.</p>
    <p style="color: rgba(255,255,255,.55);">Keep an eye on your phone and email for my message.</p>

    <div class="btnrow">
      <a class="btn" href="/">← Back to Home</a>
      <a class="btn" href="/wefts">View Pricing</a>
    </div>
  </div>
</body>
</html>
